x-e2e-producer: &e2e-producer
  E2E_PRODUCER_USER: playwright-producer@example.test
  E2E_PRODUCER_PASSWORD: playwright-only

services:
  frappe:
    # The prebaked bench (docker/Dockerfile.bench). Software only: the site,
    # its database and the auraos clone are still created per run and thrown
    # away with the stack, which is the attributability every result this week
    # rests on. What the image saves is `bench init`, which is the same bytes
    # every boot and was most of the ten minutes.
    #
    # e2e only. The dev and prod stacks keep frappe/bench:latest until the
    # compose restructure lands: changing the base file would change what dev
    # becomes on its next recreation, and that is not a thing to do to the
    # stack the founder is walking through.
    image: auraos/bench-prebaked:v15
    build:
      context: ..
      dockerfile: docker/Dockerfile.bench
    environment: *e2e-producer

  # The runner for the React app. There was a second one alongside it for the
  # Vue app until #103 retired that app; they differed only in working
  # directory and node_modules volume, because the two were separate npm
  # projects.
  playwright-react:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    working_dir: /workspace/repo/frontend-react
    environment:
      <<: *e2e-producer
      E2E_BASE_URL: http://frappe:8000
      E2E_ADMIN_USER: Administrator
      E2E_ADMIN_PASSWORD: admin
      # Off the bind mount: this container is root, so signed-in state written
      # under /workspace/repo would land on the host owned by root and outlive
      # the run. It is consumed entirely inside this container.
      E2E_AUTH_DIR: /tmp/playwright-auth
    volumes:
      - ..:/workspace/repo
      - playwright-react-node-modules:/workspace/repo/frontend-react/node_modules
      - ../.e2e-npm-cache:/root/.npm
    depends_on:
      - frappe

volumes:
  playwright-react-node-modules:
