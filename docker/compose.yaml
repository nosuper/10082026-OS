# AuraOS development environment.
#
#   cd docker && docker compose up -d
#
# First boot takes several minutes: the frappe container initialises a
# bench, creates the dev site and installs the auraos app (see init.sh),
# then runs `bench start`. Follow progress with:
#
#   docker compose logs -f frappe
#
# Site: http://localhost:8000 (login Administrator / admin)
# Placeholder page: http://localhost:8000/aura
services:
  mariadb:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD: admin
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/repo/docker/init.sh
    working_dir: /home/frappe
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    # Ports are per-stack so several previews can run at once;
    # scripts/preview.sh derives them from the ticket name and the
    # defaults keep a bare `docker compose up` working as before.
    ports:
      - "${AURA_WEB_PORT:-8000}:8000" # bench web
      - "${AURA_SOCKET_PORT:-9000}:9000" # socketio
      - "${AURA_VITE_PORT:-8080}:8080" # vite dev server (npm run dev in frontend/)
    volumes:
      - ..:/workspace/repo
      # Mounted at the home dir, not the bench dir: bench init refuses
      # to run into an existing (volume-created) directory, while an
      # empty named volume at $HOME is seeded from the image on first
      # mount and the bench is then created inside it.
      - bench-data:/home/frappe

volumes:
  mariadb-data:
  bench-data:
