name: CI

on:
  push:
  workflow_dispatch:

jobs:
  pure-tests:
    name: Pure pytest (pricing seam)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pytest
      - name: Test
        run: pytest -v

  frontend-build:
    name: frappe-ui build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Assert page shell was produced
        run: test -f auraos/www/aura.html && grep -q aura-frontend-root auraos/www/aura.html

  site-tests:
    name: Frappe site tests (incl. permission proof)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure MariaDB for Frappe
        run: |
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "
            SET GLOBAL character_set_server = 'utf8mb4';
            SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Init bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch version-15 ~/frappe-bench

      - name: Configure bench
        working-directory: /home/runner/frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379

      - name: Get app
        working-directory: /home/runner/frappe-bench
        run: bench get-app auraos "$GITHUB_WORKSPACE"

      - name: Build frontend inside the bench copy
        working-directory: /home/runner/frappe-bench/apps/auraos/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Create site and install app
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app auraos

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app auraos
