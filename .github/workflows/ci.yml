name: CI

on:
  push:
  workflow_dispatch:

jobs:
  # The Vue frontend is retired (#103). This job exists because retiring it
  # once was not enough: the deletion lived on `feat/react-frontend` while
  # `main` went on showing an intact `frontend/`, and three tickets built new
  # Vue screens against a decision they had no way to see (#160, #161, #162).
  # #164 closed that gap. This is what stops it reopening - a decision nobody
  # can act against is worth more than a decision written down somewhere.
  no-vue-frontend:
    name: The Vue frontend stays retired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse files under frontend/
        run: |
          # Tracked files only, so an untracked local build directory or a
          # stale checkout cannot fail somebody's CI for something git does
          # not carry.
          found=$(git ls-files -- 'frontend/' | head -50)
          if [ -n "$found" ]; then
            echo "::error::frontend/ is the retired Vue app (#103). The frontend is frontend-react/."
            echo ""
            echo "These files are tracked under frontend/ and should not be:"
            echo "$found"
            echo ""
            echo "If you are porting a screen, it belongs in frontend-react/src/routes/."
            echo "The old Vue sources are readable at 6b206f7 - see #165."
            exit 1
          fi
          echo "frontend/ is empty, as it should be."

  # Two branches each took ADR 0003 independently on 2026-08-25 and both
  # landed, so the repository carried two different decisions under one
  # number and CONTEXT.md cited it twice without saying which. Renumbering
  # was the fix; this is what stops the next pair.
  #
  # It rides in the same job as the frontend guard because both are the same
  # kind of check - a fact about the tree that should be impossible to break
  # rather than a thing to remember - and a second three-second job would be
  # more YAML than test.
  adr-numbers:
    name: ADR numbers are unique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse two ADRs with the same number
        run: |
          # The number is the filename's leading digits. Sorted, counted, and
          # anything seen twice is printed with the files that claim it.
          dupes=$(ls docs/adr/ | grep -oE '^[0-9]+' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Two ADRs share a number. Renumber the newer one."
            for n in $dupes; do
              echo "  $n is claimed by:"
              ls docs/adr/ | grep "^$n" | sed 's/^/    /'
            done
            exit 1
          fi
          echo "Every ADR has its own number."

  pure-tests:
    name: Pure pytest (pricing seam)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pytest
      - name: Test
        run: pytest -v

  # This job built the frappe-ui app until #103 retired it. It now builds the
  # React app, which CI had never built at all - so until this change, the only
  # frontend whose build was checked here was the one being deleted.
  frontend-build:
    name: React build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install
        working-directory: frontend-react
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: frontend-react
        run: npm run build
      - name: Assert page shell was produced
        run: test -f auraos/www/aura-next.html && grep -q aura-next-root auraos/www/aura-next.html

  site-tests:
    name: Frappe site tests (incl. permission proof)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure MariaDB for Frappe
        run: |
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "
            SET GLOBAL character_set_server = 'utf8mb4';
            SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Init bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch version-15 ~/frappe-bench

      - name: Configure bench
        working-directory: /home/runner/frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379

      - name: Get app
        working-directory: /home/runner/frappe-bench
        run: bench get-app auraos "$GITHUB_WORKSPACE"

      # Built inside the bench copy, not the workspace: the site tests assert
      # the page shell and its assets resolve, and they read them from the
      # clone bench actually serves.
      - name: Build frontend inside the bench copy
        working-directory: /home/runner/frappe-bench/apps/auraos/frontend-react
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Create site and install app
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app auraos

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          mkdir -p sites/assets
          ln -sfn /home/runner/frappe-bench/apps/auraos/auraos/public sites/assets/auraos
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app auraos

  browser-tests:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache browser-test npm packages
        uses: actions/cache@v4
        with:
          path: .e2e-npm-cache
          key: playwright-npm-${{ runner.os }}-${{ hashFiles('frontend-react/package-lock.json') }}
          restore-keys: |
            playwright-npm-${{ runner.os }}-

      - name: Run disposable Chromium suite
        run: ./scripts/e2e.sh

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            frontend-react/test-results
            frontend-react/playwright-report
          if-no-files-found: ignore
          retention-days: 7
